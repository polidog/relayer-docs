; Production PHP overrides for the SINGLE-BINARY build.
;
; Sibling of docker/php.ini. A static binary has no $PHP_INI_DIR to drop
; a conf.d file into: `frankenphp php-server` appends the extracted app
; root to PHP_INI_SCAN_DIR when a file named `php.ini` sits there, so
; this file is copied to the app root and picked up from inside the
; binary. There is no php.ini-production underneath it, so unlike
; docker/php.ini this has to state the production defaults itself.
expose_php = Off
display_errors = Off
log_errors = On
; FrankenPHP/Caddy forwards stderr into Fly's logs.
error_log = /proc/self/fd/2

; Production defaults that the classic image inherits from
; php.ini-production and that are NOT the compiled-in defaults.
error_reporting = E_ALL & ~E_DEPRECATED
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
max_execution_time = 30

; A statically linked OpenSSL/curl has no distro-configured trust store
; compiled in, so point both at the runtime image's CA bundle
; (ca-certificates on debian:*-slim). Without this the Turso API calls
; — the only thing this app talks to over TLS — fail certificate
; verification at runtime instead of at build.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

; Code is immutable inside the binary — skip timestamp checks. The PSX
; and route caches are written by the entrypoint BEFORE the server
; starts, so nothing this setting hides is ever stale.
; Tuned small to fit the 256MB Fly VM: this app's compiled footprint
; is tiny (a handful of vendor + precompiled-PSX files), so a large
; opcache reservation would just waste half the box's RAM.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 32
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 8
