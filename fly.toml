# Fly.io deployment for the Relayer docs site.
#
# Built from static-build.Dockerfile: a single ~104MB executable with
# the application, PHP 8.5, the extensions and Caddy inside it, on a
# debian-slim base carrying nothing but a CA bundle. It serves plain
# HTTP on :8080 (docker/embed/Caddyfile.classic), so internal_port
# below just has to match.
#
# Why this instead of ./Dockerfile, which builds the same app the
# ordinary way: 655MB → 192MB image, and 1393ms → 700ms from container
# start to first 200, which is the number that matters here because
# auto_stop_machines means visitors regularly pay a cold start.
# Verified byte-identical to the classic image on every endpoint before
# the switch. ./Dockerfile is kept as the fallback — swapping the
# `dockerfile` line back is a complete rollback.
#
# The cost is build time: PHP is compiled from source, ~45 minutes on a
# 16-core machine, so deploys are slow even though the app itself is
# unchanged. See static-build.Dockerfile for why the prebuilt-toolchain
# shortcuts do not work.
#
# Runtime writes: the binary untars itself into /var/www/html at boot
# and the entrypoint compiles the PSX/route caches there (~0.1s) — the
# embedded app's absolute path is not knowable at build time. Those are
# the only writes; the doc content is read from Turso over HTTP. All of
# it is ephemeral rootfs, so nothing needs a volume.
#
# Docs content is NOT deployed here — it is written to Turso directly
# from a local machine with `bin/docs sync --prune`. This service only
# reads Turso. Credentials are Fly secrets, not in this file:
#   fly secrets set TURSO_DATABASE_URL=... TURSO_AUTH_TOKEN=...
#
# One-time setup and CI details: see .github/workflows/deploy.yml and
# the "本番デプロイ" section in README.md.

app = "relayer-doc"
primary_region = "nrt"   # Tokyo — was asia-northeast1 on Cloud Run

[build]
  dockerfile = "static-build.Dockerfile"

[env]
  APP_ENV = "production"
  # The repo .env is .dockerignore'd, so production i18n config must
  # live here (not .env, which only configures local dev). This is the
  # full bilingual config, verified end-to-end against this exact
  # production Dockerfile image: ja is canonical/unprefixed and served
  # byte-identically to the pre-i18n site (doc-<hash> ETag unmoved),
  # en is reached at /en/... (Relayer strips the prefix before route
  # matching — confirmed working under FrankenPHP/Caddy), via the
  # `locale` cookie, or Accept-Language. The doc store overlays en
  # from document_translations and falls back to ja when untranslated.
  APP_LOCALE = "ja"
  APP_LOCALES = "ja,en"
  LOCALE_COOKIE = "locale"
  LOCALE_PATH_PREFIX = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero like Cloud Run --min-instances 0: stop idle machines,
  # cold-start on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Cheapest tier: smallest shared CPU + minimum RAM. Single machine
# (no HA) — a deliberate cost/availability trade-off for a low-traffic
# docs site, same spirit as scale-to-zero above. Keep deploys single
# with `fly deploy --ha=false`.
[[vm]]
  size = "shared-cpu-1x"   # smallest/cheapest CPU tier
  memory = "256mb"         # minimum RAM tier (opcache tuned to fit, see docker/php.ini)
